        /* ২০টি ডাইনামিক ফিল্টারের CSS ইফেক্টস */
        .filter-normal { filter: none !important; }
        .filter-beauty { filter: brightness(1.15) contrast(0.95) saturate(1.05) !important; }
        .filter-vintage { filter: sepia(0.5) contrast(0.9) brightness(0.95) !important; }
        .filter-pinkish { filter: hue-rotate(330deg) saturate(1.1) brightness(1.05) !important; }
        .filter-bw { filter: grayscale(1) contrast(1.2) !important; }
        .filter-cyber { filter: hue-rotate(90deg) saturate(1.5) brightness(1.1) !important; }
        .filter-warm { filter: sepia(0.2) saturate(1.2) contrast(1) !important; }
        .filter-cool { filter: hue-rotate(180deg) saturate(1.1) !important; }
        .filter-dramatic { filter: contrast(1.4) brightness(0.8) !important; }
        .filter-fade { filter: opacity(0.85) saturate(0.8) contrast(0.9) !important; }
        .filter-retro { filter: sepia(0.3) hue-rotate(340deg) saturate(1.3) !important; }
        .filter-neon { filter: saturate(2) contrast(1.1) brightness(1.1) !important; }
        .filter-invert { filter: invert(0.9) !important; }
        .filter-blur { filter: blur(1px) !important; }
        .filter-bright { filter: brightness(1.3) !important; }
        .filter-dark { filter: brightness(0.7) contrast(1.1) !important; }
        .filter-gold { filter: sepia(0.4) saturate(1.8) brightness(1) !important; }
        .filter-cold { filter: saturate(0.7) hue-rotate(190deg) brightness(1.05) !important; }
        .filter-shadow { filter: contrast(1.5) drop-shadow(4px 4px 10px black) !important; }
        .filter-soft { filter: brightness(1.05) blur(0.3px) saturate(0.95) !important; }

        /* 📐 লম্বালম্বি পপ-আপ অ্যানিমেশন (Vertical Strip Slide) */
        .vertical-panel {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            transform: translateX(20px);
            opacity: 0;
            pointer-events: none;
        }
        .vertical-panel.active {
            transform: translateX(0);
            opacity: 1;
            pointer-events: auto;
        }
        
        /* কাস্টম স্ক্রোলবার একদম চিকন করার জন্য */

stopRecBtn.addEventListener('click', () => {
    if (mediaRecorder && mediaRecorder.state === 'recording') {
        mediaRecorder.stop();
    }
});
    </script>
